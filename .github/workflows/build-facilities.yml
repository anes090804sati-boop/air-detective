
name: Build facility snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-facilities.yml'
      - 'scripts/build_facilities.py'
      - 'scripts/check_snapshot.py'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade osmium

      - name: Download South Korea OSM data
        run: |
          curl --fail --location --show-error --silent \
            --retry 4 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            --output korea.osm.pbf \
            https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          test -s korea.osm.pbf
          ls -lh korea.osm.pbf

      - name: Build facility data
        run: python scripts/build_facilities.py korea.osm.pbf data/facilities.json

      - name: Verify facility data
        run: python scripts/check_snapshot.py data/facilities.json

      - name: Commit facility data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/facilities.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update facility snapshot'
            git push origin HEAD:main
          else
            echo 'Facility data is unchanged.'
          fi
