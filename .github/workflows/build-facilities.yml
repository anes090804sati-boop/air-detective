name: Build facility snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: air-detective-facilities-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade osmium

      - name: Download South Korea OSM data
        run: |
          curl --fail --location --show-error --silent \
            --retry 4 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            --output korea.osm.pbf \
            https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          test -s korea.osm.pbf
          ls -lh korea.osm.pbf

      - name: Build facility data
        run: python scripts/build_facilities.py korea.osm.pbf data/facilities.json

      - name: Verify facility data
        run: python scripts/check_snapshot.py data/facilities.json

      - name: Commit facility data safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cp data/facilities.json "$RUNNER_TEMP/facilities.json"
          for attempt in 1 2 3 4 5; do
            echo "Publishing attempt $attempt/5"
            git fetch origin main
            # Only reset the disposable runner's local checkout; never force-push.
            git reset --hard origin/main
            mkdir -p data
            cp "$RUNNER_TEMP/facilities.json" data/facilities.json
            git add data/facilities.json
            if git diff --cached --quiet; then
              echo 'Facility data already up to date.'
              exit 0
            fi
            git commit -m 'Update facility snapshot'
            if git push origin HEAD:main; then
              echo 'Facility snapshot published.'
              exit 0
            fi
            echo 'Remote changed during publishing; retrying against latest main.'
            sleep 3
          done
          echo 'Could not publish after 5 attempts.' >&2
          exit 1
